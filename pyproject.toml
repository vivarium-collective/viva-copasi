[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbg-copasi"
version = "0.1.0"
description = "process-bigraph-compatible COPASI Steps and Processes (UTC + SteadyState)"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=0.0.10",
    "bigraph-schema",
    "copasi-basico",
    "python-copasi",
    "viva-superpowers",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "bigraph-viz", "matplotlib"]

[tool.uv.sources]
# viva-superpowers (renamed from pbg-superpowers) is git-only, not on PyPI.
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["pbg_copasi*"]

[tool.setuptools.package-data]
"pbg_copasi.composites" = ["*.xml", "*.yaml"]
