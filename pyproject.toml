[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-copasi"
version = "0.2.1"
description = "process-bigraph-compatible COPASI Steps and Processes (UTC + SteadyState)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=1.8.5",
    "bigraph-schema",
    "copasi-basico",
    "python-copasi",
    "pyyaml",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
# Dashboard visualizations only. Not needed by the simulation path (see tests/test_no_superpowers.py).
dashboard = ["viva-superpowers"]
dev = ["pytest", "bigraph-viz", "matplotlib", "viva-superpowers"]

[tool.uv.sources]
# viva-superpowers (renamed from pbg-superpowers) is git-only, not on PyPI.
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["viva_copasi*", "pbg_copasi"]  # pbg_copasi = deprecation shim

[tool.setuptools.package-data]
"viva_copasi.composites" = ["*.xml", "*.yaml"]
